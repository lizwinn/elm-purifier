# SPDX-License-Identifier: MIT
#
# Runs on x86_64-linux and aarch64-linux: the flake's checks (the CLI and
# both Elm toolchains, the sandboxed builds of the fixtures under
# tests/fixtures with a run of each output and of each test suite, and the
# formatting), then tests/interactive.sh for what runs outside the sandbox
# (the lock run, the interactive commands and the publish check).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: tests/interactive.sh
